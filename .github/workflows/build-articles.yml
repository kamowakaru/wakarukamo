name: Build articles

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-articles.yml'
      - 'content/articles/**.md'
      - 'data/categories.json'
      - 'data/tags.json'
      - 'scripts/generate_site.py'
      - 'scripts/generate_social_drafts.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://kamowakaru.github.io/wakarukamo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate article pages
        run: python scripts/generate_site.py

      - name: Generate X and Threads drafts
        run: python scripts/generate_social_drafts.py

      - name: Commit generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add articles articles.html index.html categories tags data/articles.json data/analytics-pageviews.csv social-drafts sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Build articles and social drafts"
          git push
